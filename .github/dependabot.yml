version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Batch routine backend minor/patch bumps into a single PR. Majors stay
      # individual so they get their own review (e.g. gunicorn 23->26, mypy 1->2),
      # which matters because CI's backend job runs ruff + pytest only, not mypy.
      backend-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Frontend npm dependencies
  # NOTE: frontend/package.json declares chokidar + readdirp as direct
  # devDependencies even though the app doesn't import them. Angular 22 tooling
  # peers chokidar ^5 (via @angular-devkit/core), which npm nests under every
  # consumer; Dependabot's lock regeneration drops those peer-nested nodes and
  # every npm PR then fails `npm ci` ("Missing: chokidar@5 from lock file").
  # Declaring them direct hoists a single top-level copy that survives the regen.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Angular 22's @angular/compiler-cli peers typescript ">=6.0 <6.1". Cap TS
      # below 6.1 so Dependabot only proposes Angular-22-compatible bumps; a newer
      # TS rides with the next Angular major. Raise this ceiling when Angular is
      # upgraded.
      - dependency-name: "typescript"
        versions: [">=6.1"]
      # @types/node tracks the Node major we build/run on (Node 22 in CI). A
      # higher major (26 = Node 26 types) drifts the type tree and reintroduces
      # the incomplete-lock `npm ci` failures we fixed by pinning @types/node ^22.
      # Cap it to 22.x; raise this when the CI/runtime Node major changes.
      - dependency-name: "@types/node"
        versions: [">=23"]
      # angular-eslint majors track Angular majors (v23 peers @angular/cli 23).
      # Keep it on the Angular-22 line; a higher angular-eslint rides with the
      # next Angular major. Raise this when Angular is upgraded.
      - dependency-name: "angular-eslint"
        versions: [">=23"]
      # Angular framework majors are a deliberate `ng update` migration, not a
      # Dependabot bump — an isolated major bump just fails the build (needs the
      # migration schematics). Ignore framework majors permanently; do them by
      # hand with `ng update` (see docs/dev-journal for the 19->22 upgrade), then
      # raise the TS and angular-eslint ceilings above.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ngtools/*"
        update-types: ["version-update:semver-major"]
    groups:
      # Angular framework + build tooling + zone.js move in lockstep. Grouping
      # batches their minor/patch updates into ONE coordinated PR instead of
      # isolated per-package PRs that break peer-dependency resolution (as
      # happened with @angular/router, @angular-devkit/build-angular and zone.js
      # in July 2026). Majors are ignored above — do them as a deliberate
      # `ng update` migration, then lift the caps.
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngtools/*"
          - "zone.js"
      # Batch everything else (lint/format/test tooling, rxjs, tslib, @types)
      # at minor/patch into one PR. Non-Angular majors still come individually
      # so they can be reviewed on their own.
      frontend-minor:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngtools/*"
          - "zone.js"
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      # One PR for all Action version bumps.
      actions:
        applies-to: version-updates
        patterns:
          - "*"
