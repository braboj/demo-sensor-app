version: 2
updates:
  # Backend Python dependencies
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Batch routine backend minor/patch bumps into a single PR. Majors stay
      # individual so they get their own review (e.g. gunicorn 23->26, mypy 1->2),
      # which matters because CI's backend job runs ruff + pytest only, not mypy.
      backend-minor:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Frontend npm dependencies
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # Angular 19's @angular-devkit/build-angular peers typescript ">=5.5 <5.8".
      # Cap TS below 5.8 so Dependabot only proposes Angular-19-compatible bumps
      # (e.g. 5.7.x); a higher TS rides with the Angular major upgrade (grouped in
      # `angular`). Without this the frontend-minor group keeps pulling TS 5.9,
      # which fails peer resolution (ERESOLVE) and blocks the safe bumps batched
      # with it. Lift this cap when Angular is upgraded.
      - dependency-name: "typescript"
        versions: [">=5.8"]
      # angular-eslint majors track Angular majors: v20+ pulls a newer nested
      # @angular-devkit/core that peers chokidar/readdirp ^5, which Dependabot
      # then drops from the lock (incomplete lock -> `npm ci` fails). Pin to the
      # Angular-19 line (19.x); a higher angular-eslint rides with the Angular
      # major upgrade. Lift this cap when Angular is upgraded.
      - dependency-name: "angular-eslint"
        versions: [">=20"]
    groups:
      # Angular framework + build tooling + zone.js must move in lockstep at the
      # same major. Grouping them makes an upgrade arrive as ONE coordinated PR
      # instead of isolated per-package PRs that break peer-dependency resolution
      # (as happened with @angular/router, @angular-devkit/build-angular and
      # zone.js in July 2026). No update-types filter, so majors are coordinated
      # into a single PR rather than suppressed — take it alongside `ng update`.
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngtools/*"
          - "zone.js"
      # Batch everything else (lint/format/test tooling, rxjs, tslib, @types)
      # at minor/patch into one PR. Non-Angular majors still come individually
      # so they can be reviewed on their own.
      frontend-minor:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@angular/*"
          - "@angular-devkit/*"
          - "@ngtools/*"
          - "zone.js"
        update-types:
          - minor
          - patch

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      # One PR for all Action version bumps.
      actions:
        applies-to: version-updates
        patterns:
          - "*"
